name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'release/**'
      - 'apps.json'

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Tuist (pinned in mise.toml)
        uses: jdx/mise-action@v2

      - name: Show toolchain
        run: |
          xcodebuild -version
          mise exec -- tuist version
          xcrun --sdk appletvos --show-sdk-version

      - name: Build unsigned IPA
        env:
          NUVIO_IPA_OUTPUT_DIR: ${{ runner.temp }}/ipa
        run: mise exec -- bash scripts/build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTVOSxIPTV-unsigned-ipa
          path: ${{ runner.temp }}/ipa/NuvioTV-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ runner.temp }}/ipa/NuvioTV-unsigned.ipa#NuvioTVOSxIPTV-${GITHUB_REF_NAME}-unsigned.ipa" \
            --title "NuvioTVOSxIPTV $GITHUB_REF_NAME" \
            --notes "Unsigned tvOS IPA – sideload and re-sign with your own Apple ID."
