name: Build IPA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch (or tag/SHA) to check out and build
        required: true
        type: string

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install mise
        run: curl https://mise.run | sh

      - name: Install pinned tool versions (Tuist)
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mise" install

      - name: Build IPA
        run: bash scripts/build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-unsigned-ipa
          path: build-ipa/*.ipa
          if-no-files-found: error
