name: Update latest beta links

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to use for the README beta hub
        required: false
        type: string
      all:
        description: Add notification and feedback links to every published release
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update latest beta block
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '[.[] | select(.draft == false)] | first | .tag_name')"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > /tmp/release.json

          python3 - /tmp/release.json README.md <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          release = json.loads(Path(sys.argv[1]).read_text())
          readme_path = Path(sys.argv[2])
          readme = readme_path.read_text()

          tag = release["tag_name"]
          title = release.get("name") or tag
          ipa = next(
              (asset for asset in release.get("assets", [])
               if asset.get("name", "").lower().endswith(".ipa")),
              None,
          )
          if ipa is None:
              raise SystemExit(f"No .ipa asset found in release {tag}")

          start_marker = "<!-- BEGIN LATEST_BETA -->"
          end_marker = "<!-- END LATEST_BETA -->"
          start = readme.index(start_marker) + len(start_marker)
          end = readme.index(end_marker, start)

          block = (
              f"\n**{title}** is the latest tvOS release.\n\n"
              f"[Quick download (.ipa)]({ipa['browser_download_url']}) · "
              f"[Read the release notes]({release['html_url']}) · "
              f"[Manage notifications](https://github.com/"
              f"{os.environ['GITHUB_REPOSITORY']}/subscription) → choose **Custom → Releases** · "
              f"[Report a bug or suggest an idea](https://github.com/"
              f"{os.environ['GITHUB_REPOSITORY']}/issues/new/choose)\n"
          )
          readme_path.write_text(readme[:start] + block + readme[end:])
          PY

      - name: Add notification and feedback links to release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          UPDATE_ALL: ${{ inputs.all || false }}
        run: |
          set -euo pipefail

          if [ "$UPDATE_ALL" = "true" ]; then
            release_tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')"
          else
            tag="$RELEASE_TAG"
            if [ -z "$tag" ]; then
              tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '[.[] | select(.draft == false)] | first | .tag_name')"
            fi
            release_tags="$tag"
          fi

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
            release_id="$(printf '%s' "$release_json" | jq -r '.id')"
            body="$(printf '%s' "$release_json" | jq -r '.body // ""')"
            links="**New beta alerts:** [Manage notifications](https://github.com/${GITHUB_REPOSITORY}/subscription) → choose **Custom → Releases** · [Report a bug or suggest an idea](https://github.com/${GITHUB_REPOSITORY}/issues/new/choose)"

            if [[ "$body" != *"${GITHUB_REPOSITORY}/subscription"* ]]; then
              body="${body}"$'\n\n'"$links"
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f body="$body" >/dev/null
              echo "Updated release $tag"
            else
              echo "Release $tag already contains the beta links"
            fi
          done <<< "$release_tags"

      - name: Commit README update and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BRANCH: automation/update-latest-beta-links
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README already points to the latest beta."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$PR_BRANCH"
          git add README.md
          git commit -m "docs: update latest beta links"
          git push --force origin "HEAD:${PR_BRANCH}"

          existing_pr="$(gh pr list --head "$PR_BRANCH" --base "$DEFAULT_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing_pr" ]; then
            echo "Updated existing pull request: $existing_pr"
          else
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$PR_BRANCH" \
              --title "docs: update latest beta links" \
              --body "Updates the README beta hub with the latest download, release notes, notification, and feedback links."
          fi
